const MENU = [["a-propos", "À propos &amp; contact"], ["edition", "Édition"], ["photo", "Photo"], ["video", "Vidéo"], ["visites", "Visites officielles"], ["spectacles", "Spectacles"], ["ia", "IA"], ["archives", "Archives"]];
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fr = t => (t||"").replace(/ ([:;!?»])/g," $1").replace(/(«) /g,"$1 ");
const T = s => esc(fr(s)).replace(/\[À COMPLÉTER[^\]]*\]/g,'<mark class="todo" title="Information à compléter">à compléter</mark>');
const titreAff = t => { const w=t.trim().split(" "); return w.length<2 ? esc(t) : esc(w.slice(0,-1).join(" "))+" <em>"+esc(w[w.length-1])+"</em>"; };
const img = (dir,p) => p[0].startsWith("http") ? p[0] : `img/${dir}/${p[0]}`;
const RUBKEYS = ["visites","spectacles","photo","edition","ia"];
const MENUKEYS = MENU.map(m=>m[0]);

/* Menus */
let current="a-propos";
function renderMenus(){
  document.getElementById("nav").innerHTML = MENU.map(([k,l]) => `<a href="#${k}"${k===current?' aria-current="page"':''}>${l}</a>`).join("");
  document.getElementById("menuList").innerHTML = MENU.map(([k,l],i) => `<li style="--i:${i}"><a href="#${k}"${k===current?' aria-current="page"':''}>${l}</a></li>`).join("");
}
const menu=document.getElementById("menu"), menuBtn=document.querySelector(".top .menu-btn");
function setMenu(open){ menu.hidden=!open; menuBtn.setAttribute("aria-expanded",String(open)); document.body.style.overflow=open?"hidden":""; if(open) menu.querySelector("[data-close]").focus(); }
menuBtn.addEventListener("click",()=>setMenu(true));
menu.querySelector("[data-close]").addEventListener("click",()=>{ setMenu(false); menuBtn.focus(); });
menu.addEventListener("click",e=>{ if(e.target.closest("a")) setMenu(false); });

/* Images */
function frameImg(dir, p, alt, speed){
  return `<img class="fimg" src="${img(dir,p)}" alt="${esc(alt)}" width="${p[1]}" height="${p[2]}" loading="lazy" decoding="async">`;
}
function galImg(dir, p, alt){
  return `<img class="gimg" src="${img(dir,p)}" alt="${esc(alt)}" width="${p[1]}" height="${p[2]}" loading="lazy" decoding="async">`;
}
function pickCover(photos, wantPortrait){
  if(!photos.length) return null;
  const ok = photos.filter(p => wantPortrait ? p[2]>p[1] : p[1]>p[2]);
  return (ok[0]) || photos[0];
}
let LB = {list:[],i:0,dir:"",title:""};
function zoomBtn(alt){ return `<button class="zoom" type="button" aria-label="Agrandir : ${esc(alt)}"></button>`; }

/* Liste d'une rubrique */
const liste=document.getElementById("liste"), fiche=document.getElementById("fiche");
const PER = innerWidth<700 ? 2 : 3;
function rowsHTML(items, per, mk, partial){
  let h="";
  for(let i=0;i<items.length;i+=per){
    const ch=items.slice(i,i+per);
    const w = partial && ch.length<per ? ` style="max-width:${ch.length/per*100}%;margin-left:0"` : "";
    h+=`<div class="grow"${w}>`+ch.map(mk).join("")+`</div>`;
  }
  return h;
}
const arOf=p=>p&&p[2]?p[1]/p[2]:1.5;
function renderRubrique(key){
  const R=DATA[key];
  const items=R.items;
  const nImg = items.reduce((n,i)=>n+i.photos.length,0);
  let h = `<section class="hero wrap" aria-labelledby="h-rub">
    <p class="util">Rubrique · ${esc(R.kicker)}</p>
    <h1 id="h-rub" class="display" data-speed="0.35">${esc(R.label)}</h1>
    <p class="lede">${T(R.lede)}</p>
    <div class="meta"><span class="util">${items.length} pages</span></div>
  </section>
  <div class="wrap"><div class="tiles">` + rowsHTML(items, PER, s=>{
    const c=s.cover||s.photos[0], ar=arOf(c);
    return `<a class="tile" style="flex:${ar} 1 0" href="#${key}/${s.id}" aria-label="${esc(s.titre)}">${c?galImg(s.dir,c,s.titre):`<span class="tph"></span>`}<span class="cap"><b>${titreAff(s.titre)}</b><span>${T(s.date)}</span></span></a>`; }, true) + `</div></div>`;
  liste.innerHTML = h;
}

function corpsHTML(arr){
  let h="", ul=false;
  for(const l of arr){
    if(l.startsWith("• ")){ if(!ul){h+="<ul>";ul=true} h+=`<li>${T(l.slice(2))}</li>`; continue }
    if(ul){h+="</ul>";ul=false}
    h+=`<p>${T(l)}</p>`;
  }
  return h+(ul?"</ul>":"");
}

/* Fiche */
function renderFiche(key,s){
  const R=DATA[key], items=R.items, i=items.indexOf(s), prev=items[i-1], next=items[i+1];
  const ph=s.photos;
  const fig=(p,n)=>`<figure style="flex:${arOf(p)} 1 0">${galImg(s.dir,p,`${s.titre}, photo ${n+1}`)}${zoomBtn(`${s.titre}, photo ${n+1}`)}</figure>`;
  const heroH = ph.length ? `<div class="gallery hero-img"><div class="grow">${fig(ph[0],0)}</div></div>` : "";
  let restH="";
  if(ph.length>1){
    const gr=(s.groups||[[2,ph.length]]).map(g=>g.slice()); gr[0][1]-=1;
    let pos=1; restH=`<div class="gallery rest">`;
    for(const [per,cnt] of gr){ if(cnt<=0) continue;
      const sl=ph.slice(pos,pos+cnt).map((p,k)=>[p,pos+k]); pos+=cnt;
      restH+=rowsHTML(sl,per,x=>fig(x[0],x[1]),false); }
    restH+=`</div>`;
  }
  const shown=ph.map(p=>({p}));
  fiche.innerHTML = `
    <a class="back" href="#${key}">${esc(R.retour)}</a>
    ${heroH}
    <header class="c"><span class="util">${esc(R.label)}</span><h1 class="display">${titreAff(s.titre)}</h1></header>
    <div class="intro c">
      <p>${T(s.intro)}</p>
      <dl class="facts">
        <dt>Date</dt><dd>${T(s.date)}</dd>
        ${s.interv?`<dt>${esc(R.artlabel)}</dt><dd>${T(s.interv)}</dd>`:""}
        <dt>Photographe</dt><dd>Emmanuel Quéau</dd>
      </dl>
    </div>
    ${s.corps.length?`<div class="corps">${corpsHTML(s.corps)}</div>`:""}
    ${restH}
    <nav class="pager" aria-label="Navigation entre les pages">
      ${prev?`<a href="#${key}/${prev.id}"><span class="util">← Plus récent</span><span class="t">${esc(prev.titre)}</span></a>`:`<span></span>`}
      ${next?`<a href="#${key}/${next.id}"><span class="util">Plus ancien →</span><span class="t">${esc(next.titre)}</span></a>`:`<span></span>`}
    </nav>`;
  LB = {list: shown.map(x=>x.p), i:0, dir:s.dir, title:s.titre};
}

/* Pages spéciales */
function renderAPropos(){
  const R=DATA["a-propos"], t=R.texte;
  const sections={}; let cur="intro"; sections[cur]=[];
  t.slice(1).forEach(p=>{ if(["EXPÉRIENCE","FORMATION","COMPÉTENCES"].includes(p)){cur=p;sections[cur]=[];} else sections[cur].push(p); });
  const bio = sections.intro[0]||"";
  // Expérience : un bloc par ligne de poste (« année · titre — lieu »)
  const jobs=[]; (sections["EXPÉRIENCE"]||[]).forEach(p=>{ if(/^(Depuis \d{4}|\d{4}\s*[–-]\s*\d{4})\s·/.test(p)){ const [a,...r]=p.split(" · "); jobs.push({date:a,head:r.join(" · "),lines:[]}); } else if(jobs.length) jobs[jobs.length-1].lines.push(p); });
  const exp = jobs.map(j=>{ const [role,lieu]=j.head.split(" — "); return `<div class="job"><span class="util">${T(j.date)}</span><h3>${T(role)}</h3>${lieu?`<span class="util">${T(lieu)}</span>`:""}${corpsHTML(j.lines)}</div>`; }).join("");
  const formation=(sections["FORMATION"]||[]).map(p=>`<p>${T(p)}</p>`).join("");
  const comp=sections["COMPÉTENCES"]||[];
  const skills = (comp[0]||"").split(" · ").map(s=>`<li>${T(s)}</li>`).join("");
  const kv = comp.slice(1).filter(p=>p.includes(" : ")||p.includes(" : ")).map(p=>{ const m=p.split(/ ?: /); return `<dt class="util">${T(m[0])}</dt><dd>${T(m.slice(1).join(" : "))}</dd>`; }).join("");
  const cover = R.photos[0];
  const cards = RUBKEYS.concat(["video","archives"]).map(k=>{
    const label = DATA[k].label; const first = (DATA[k].items||[]).find(i=>i.photos.length);
    const count = DATA[k].items ? DATA[k].items.length+" pages" : (k==="video"? DATA.video.films.length+" films" : DATA.archives.projets.length+" projets");
    const im = first ? `<img src="${img(first.dir,pickCover(first.photos,true))}" alt="" loading="lazy" decoding="async">` : "";
    return `<a href="#${k}">${im}<span class="cap"><b>${esc(label)}</b><span>${count}</span></span></a>`;
  }).join("");
  liste.innerHTML = `
  <section class="hero wrap" aria-labelledby="h-rub">
    <p class="util">Directeur de la Communication / Journaliste / Rédacteur / Photographe / Vidéaste / Graphiste / IA &amp; automatisation</p>
    <h1 id="h-rub" class="display" data-speed="0.35">Emmanuel <em>Quéau</em></h1>
    <p class="lede">${T(bio)}</p>
    <div class="meta"><a class="util" href="#contact" style="color:var(--fg)">Contact ↓</a></div>
  </section>
  <div class="wrap">
    <section class="cv"><h2>Expérience</h2><div>${exp}</div></section>
    <section class="cv"><h2>Formation</h2><div>${formation}</div></section>
    <section class="cv"><h2>Compétences</h2><div><ul>${skills}</ul><dl class="kv facts">${kv}</dl></div></section>
    <section class="cv" id="contact"><h2>Contact</h2><div><dl class="facts"><dt>Courriel</dt><dd><a href="mailto:queauem@gmail.com">queauem@gmail.com</a></dd><dt>Photographie</dt><dd><a href="https://www.flickr.com/photos/queau" target="_blank" rel="noopener">flickr.com/photos/queau</a></dd></dl></div></section>
  </div>`;
  fiche.innerHTML="";
}

function ytid(u){const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:""}
function vOpen(src,portrait){
  const old=document.getElementById("vmodal"); if(old) old.remove();
  const m=document.createElement("div"); m.id="vmodal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Lecteur vidéo");
  m.innerHTML=`<button type="button" class="vclose" aria-label="Fermer">×</button><div class="vbox${portrait?" ig":""}"><iframe src="${src}" title="Vidéo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  const close=()=>{m.remove();document.removeEventListener("keydown",esc_);document.body.style.overflow=""};
  const esc_=e=>{if(e.key==="Escape")close()};
  m.addEventListener("click",e=>{if(!e.target.closest(".vbox"))close()});
  document.addEventListener("keydown",esc_);
  document.body.style.overflow="hidden"; document.body.appendChild(m); m.querySelector(".vclose").focus();
}
function vidInit(){
  document.querySelectorAll(".vth").forEach(b=>{
    const id=b.dataset.id,img=b.querySelector("img");let t=null,i=0;
    if(id.startsWith("ig:")){
      b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}});
      b.addEventListener("click",()=>vOpen(`https://www.instagram.com/reel/${id.slice(3)}/embed/`,true));
      return;
    }
    if(id.startsWith("v:")){
      const vid=id.slice(2);
      fetch("https://vimeo.com/api/oembed.json?url="+encodeURIComponent("https://vimeo.com/"+vid)).then(r=>r.json()).then(j=>{if(j.thumbnail_url)img.src=j.thumbnail_url.replace(/_\d+x\d+/,"_1280")}).catch(()=>{});
      b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}});
      b.addEventListener("click",()=>vOpen(`https://player.vimeo.com/video/${vid}?autoplay=1`));
      return;
    }
    const fr=["1","2","3"].map(n=>`https://i.ytimg.com/vi/${id}/hq${n}.jpg`);
    const stop=()=>{clearInterval(t);t=null;img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`};
    const go=()=>{if(t)return;fr.forEach(u=>{new Image().src=u});i=0;t=setInterval(()=>{img.src=fr[i++%3]},650)};
    b.addEventListener("mouseenter",go);b.addEventListener("mouseleave",stop);b.addEventListener("focus",go);b.addEventListener("blur",stop);
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}});
    b.addEventListener("click",()=>{clearInterval(t);vOpen(`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`)});
  });
}
function renderVideo(){
  const V=DATA.video;
  liste.innerHTML = `<section class="hero wrap"><p class="util">Rubrique · Films pour la Ville</p>
    <h1 class="display" data-speed="0.35">Vidéo</h1>
    <p class="lede">${T(V.intro[0]||"")}</p>
    <div class="meta"><span class="util">${V.films.length} films</span><span class="util">Chaîne YouTube de la Ville</span></div></section>
    <div class="wrap"><ul class="vgrid">${V.films.map(f=>{const ig=f.url.match(/instagram\.com\/reel\/([\w-]+)/);const id=ig?"ig:"+ig[1]:ytid(f.url);return `<li class="vcard"><div class="vth${ig?" noimg":""}" role="button" tabindex="0" data-id="${id}" aria-label="Lire : ${esc(f.titre)}">${ig?"":`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy">`}<span class="play"></span></div><span class="util">${esc(f.n)}${f.meta?" · "+T(f.meta):""}</span><span class="t">${T(f.titre)}</span>${f.texte?`<p>${T(f.texte)}</p>`:""}</li>`}).join("")}</ul></div>`;
  vidInit();
}
function renderArchives(){
  const A=DATA.archives;
  liste.innerHTML = `<section class="hero wrap"><p class="util">Rubrique · Collectif TROTAR · ${T(A.date)}</p>
    <h1 class="display" data-speed="0.35">Archives <em>Trotar</em></h1>
    <p class="lede">${T(A.intro[1]||A.intro[0]||"")}</p>
    <div class="meta"><span class="util">${A.projets.length} projets</span></div></section>
    <div class="wrap"><div class="corps" style="margin-left:0;max-width:80ch">${A.intro.slice(2).map(p=>`<p>${T(p)}</p>`).join("")}</div>
    <ul class="vgrid">${A.projets.map((p,i)=>{ const m=p.match(/^(.*?)(?:\s\((.*?)\))?\s—\s(.*)$/)||[null,p,"",""]; const id=(A.ids||[])[i]||""; const th=id?`<div class="vth" role="button" tabindex="0" data-id="${id}" aria-label="Lire : ${esc(m[1])}"><img src="${id.startsWith("v:")?"":`https://i.ytimg.com/vi/${id}/hqdefault.jpg`}" alt="" loading="lazy"><span class="play"></span></div>`:""; const lk=id.startsWith("v:")?`https://vimeo.com/${id.slice(2)}`:`https://www.youtube.com/watch?v=${id}`; return `<li class="vcard">${th}<span class="util">${String(i+1).padStart(2,"0")}${m[2]?" · "+T(m[2]):""}</span><span class="t">${T(m[1])}</span><p>${T(m[3])}</p></li>`; }).join("")}</ul></div>`;
  vidInit();
}
function renderContact(){
  liste.innerHTML = `<section class="hero wrap"><p class="util">Rubrique · Contact</p>
    <h1 class="display" data-speed="0.35">Contact</h1>
    <p class="lede">Une question, un projet, une collaboration : écrivez-moi.</p></section>
    <div class="wrap" style="padding-bottom:60px"><dl class="facts">
      <dt>Courriel</dt><dd><a href="mailto:queauem@gmail.com">queauem@gmail.com</a></dd>
      <dt>Photographie</dt><dd><a href="https://www.flickr.com/photos/queau" target="_blank" rel="noopener">flickr.com/photos/queau</a></dd>
    </dl></div>`;
}

/* Routage */
function route(){
  const [k,id] = location.hash.slice(1).split("/");
  const key = k==="contact" ? "a-propos" : (MENUKEYS.includes(k) ? k : "a-propos");
  const changed = key!==current; current=key; renderMenus();
  let title = DATA[key].label, s=null;
  if(RUBKEYS.includes(key) && id) s = DATA[key].items.find(x=>x.id===id);
  if(s){ renderFiche(key,s); fiche.hidden=false; liste.hidden=true; window.scrollTo(0,0); title = s.titre+" · "+title; }
  else {
    if(key==="a-propos") renderAPropos(); else if(key==="video") renderVideo(); else if(key==="archives") renderArchives(); else renderRubrique(key);
    fiche.hidden=true; liste.hidden=false; if(changed||id===undefined) window.scrollTo(0,0);
  }
  document.title = title+" · Emmanuel Quéau";
  requestAnimationFrame(parallax);
  if(k==="contact") requestAnimationFrame(()=>{ const c=document.getElementById("contact"); if(c) c.scrollIntoView(); });
}
addEventListener("hashchange", route);

/* Parallaxe (images bornées pour ne jamais découvrir le fond) */
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function parallax(){ return;
  if (reduce.matches) return;
  const vh = innerHeight;
  document.querySelectorAll("[data-speed]").forEach(el=>{
    const host = el.closest(".frame,figure,.act,.hero") || el;
    const r = host.getBoundingClientRect();
    if (r.bottom < -200 || r.top > vh + 200) return;
    const delta = el.closest(".hero") ? -scrollY : (r.top + r.height/2) - vh/2;
    let v = -delta*parseFloat(el.dataset.speed);
    if (el.classList.contains("pimg")||el.classList.contains("ph")){ const lim=r.height*0.16; v=Math.max(-lim,Math.min(lim,v)); }
    v=v.toFixed(1);
    el.style.transform = el.dataset.axis==="x" ? `translate3d(${v}px,0,0)` : `translate3d(0,${v}px,0)`;
  });
}
let ticking=false;
addEventListener("scroll",()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ parallax(); ticking=false; }); } },{passive:true});
addEventListener("resize",parallax);

/* Visionneuse */
const lb=document.getElementById("lb"), lbi=document.getElementById("lbi"), lbc=document.getElementById("lbc");
function lbShow(i){ if(!LB.list.length) return; LB.i=(i+LB.list.length)%LB.list.length; const p=LB.list[LB.i]; lbi.src=img(LB.dir,p); lbi.alt=`${LB.title}, photo ${LB.i+1}`; lbc.textContent=`${LB.i+1} / ${LB.list.length} · ${LB.title}`; }
function lbOpen(i){ lbShow(i); lb.hidden=false; document.body.style.overflow="hidden"; lb.querySelector(".x").focus(); }
function lbClose(){ lb.hidden=true; lbi.removeAttribute("src"); document.body.style.overflow=""; }
document.addEventListener("click",e=>{
  const z=e.target.closest("button.zoom"); if(!z) return;
  const figs=[...document.querySelectorAll(".gallery figure")]; lbOpen(Math.max(0,figs.indexOf(z.closest("figure"))));
});
lb.querySelector(".x").addEventListener("click",lbClose);
lb.querySelector(".p").addEventListener("click",()=>lbShow(LB.i-1));
lb.querySelector(".n").addEventListener("click",()=>lbShow(LB.i+1));
lb.addEventListener("click",e=>{ if(e.target===lb) lbClose(); });

/* Pistes et aperçu mobile */
function setPiste(p){
  document.documentElement.setAttribute("data-piste",p);
  document.querySelectorAll(".switch button[data-p]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===p)));
  try{ localStorage.setItem("piste",p); }catch(e){}
}
document.querySelectorAll(".switch button[data-p]").forEach(b=>b.addEventListener("click",()=>{ setPiste(b.dataset.p); syncFrame(); }));
const inFrame = window.self !== window.top && location.href.startsWith("about:srcdoc");
document.addEventListener("click",e=>{ const a=e.target.closest('a[href^="#"]'); if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey) return; e.preventDefault(); const h=a.getAttribute("href"); if(location.hash!==h) location.hash=h; else route(); });
if (inFrame) document.documentElement.classList.add("in-frame");
addEventListener("message",e=>{ const d=e.data||{}; if(d.type==="preview"&&inFrame){ if(d.piste) setPiste(d.piste); if(d.hash!==undefined&&location.hash!==d.hash){ location.hash=d.hash; } } });
const mv=document.getElementById("mobileView"), mf=document.getElementById("mobileFrame"), mb=document.querySelector(".switch [data-mobile]");
function syncFrame(){ if(!mv.hidden&&mf.contentWindow) mf.contentWindow.postMessage({type:"preview",piste:document.documentElement.getAttribute("data-piste"),hash:location.hash},"*"); }
function openMobile(){ const html="<!doctype html>"+document.documentElement.outerHTML.replace(/ style="transform:[^"]*"/g,""); mf.onload=syncFrame; mf.srcdoc=html; mv.hidden=false; mb.setAttribute("aria-pressed","true"); document.body.style.overflow="hidden"; }
function closeMobile(){ mv.hidden=true; mf.srcdoc=""; mb.setAttribute("aria-pressed","false"); document.body.style.overflow=""; mb.focus(); }
mb.addEventListener("click",()=> mv.hidden ? openMobile() : closeMobile());
mv.querySelector(".close").addEventListener("click",closeMobile);
mv.addEventListener("click",e=>{ if(e.target===mv) closeMobile(); });
addEventListener("keydown",e=>{
  if(!lb.hidden){ if(e.key==="Escape") lbClose(); else if(e.key==="ArrowLeft") lbShow(LB.i-1); else if(e.key==="ArrowRight") lbShow(LB.i+1); return; }
  if(e.key!=="Escape") return; if(!mv.hidden) closeMobile(); else if(!menu.hidden){ setMenu(false); menuBtn.focus(); }
});

setPiste("suisse");
route();
</script>
